<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Monitora-UnB - Universidade de Brasília - Grupo 11" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#051642"/>
      <stop offset="0.55" stop-color="#0039A6"/>
      <stop offset="1" stop-color="#1A63E6"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="0.85" cy="0.1" r="0.55">
      <stop offset="0" stop-color="#2FD6B4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2FD6B4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.05" cy="1" r="0.6">
      <stop offset="0" stop-color="#5A9BFF" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#5A9BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2FB5C9"/>
      <stop offset="1" stop-color="#3DD68C"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="dotMask"><rect width="1280" height="440" fill="url(#fade)"/></mask>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#fff" fill-opacity="0.22"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020B26" flood-opacity="0.45"/>
    </filter>
    <filter id="shadowSm" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#020B26" flood-opacity="0.40"/>
    </filter>
    <clipPath id="round"><rect width="1280" height="440" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- Fundo -->
    <rect width="1280" height="440" fill="url(#bg)"/>
    <rect width="1280" height="440" fill="url(#glowTeal)"/>
    <rect width="1280" height="440" fill="url(#glowBlue)"/>
    <rect width="1280" height="440" fill="url(#dots)" mask="url(#dotMask)"/>
    <circle cx="1060" cy="190" r="300" fill="none" stroke="#fff" stroke-opacity="0.07" stroke-width="1.5"/>
    <circle cx="1060" cy="190" r="210" fill="none" stroke="#fff" stroke-opacity="0.07" stroke-width="1.5"/>

    <!-- Selo UnB -->
    <text x="80" y="108" font-family="Outfit, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#fff" letter-spacing="-1">UnB</text>
    <rect x="80" y="117" width="74" height="3.5" rx="2" fill="url(#accent)"/>
    <rect x="176" y="78" width="1.5" height="36" fill="#fff" fill-opacity="0.35"/>
    <text x="194" y="102" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#A9D0FF" letter-spacing="3.2">UNIVERSIDADE DE BRASÍLIA</text>

    <!-- Título -->
    <text x="80" y="210" font-family="Outfit, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#fff" letter-spacing="-1.5">Monitora<tspan fill="#6EE7B7">-UnB</tspan></text>

    <!-- Frase -->
    <text x="80" y="256" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#fff">Candidate-se a uma vaga de monitor e contribua</text>
    <text x="80" y="287" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#fff">com o aprendizado nas disciplinas que você domina.</text>
    <text x="80" y="330" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#BBD7FF">Um portal para simplificar a inscrição em monitorias</text>
    <text x="80" y="355" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#BBD7FF">da Universidade de Brasília.</text>

    <!-- Pílulas -->
    <rect x="80" y="382" width="120" height="36" rx="18" fill="#fff"/>
    <text x="140" y="405" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0039A6" letter-spacing="1.6">GRUPO 11</text>
    <rect x="212" y="382" width="236" height="36" rx="18" fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-opacity="0.35"/>
    <text x="330" y="405" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#fff">MDS 2026/2  ·  UnB FGA</text>

    <!-- Janela do sistema -->
    <g transform="translate(830,52)" filter="url(#shadow)">
      <rect width="380" height="272" rx="18" fill="#fff"/>
    </g>
    <g transform="translate(830,52)">
      <!-- barra -->
      <circle cx="24" cy="26" r="5" fill="#FF5F57"/>
      <circle cx="42" cy="26" r="5" fill="#FEBC2E"/>
      <circle cx="60" cy="26" r="5" fill="#28C840"/>
      <rect x="110" y="16" width="160" height="20" rx="10" fill="#EEF3FC"/>
      <text x="190" y="30" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#7A89A8">monitora-unb / inscricao</text>
      <rect x="0" y="50" width="380" height="1" fill="#E6ECF7"/>

      <!-- etapas -->
      <line x1="48" y1="78" x2="332" y2="78" stroke="#DCE5F5" stroke-width="2"/>
      <line x1="48" y1="78" x2="143" y2="78" stroke="#0039A6" stroke-width="2"/>
      <circle cx="48" cy="78" r="11" fill="#0039A6"/>
      <path d="M43 78.5l3.6 3.6 6.4-7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="143" cy="78" r="11" fill="#fff" stroke="#0039A6" stroke-width="2.5"/>
      <circle cx="143" cy="78" r="4" fill="#0039A6"/>
      <circle cx="237" cy="78" r="11" fill="#fff" stroke="#C9D5EC" stroke-width="2"/>
      <circle cx="332" cy="78" r="11" fill="#fff" stroke="#C9D5EC" stroke-width="2"/>
      <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#7A89A8">
        <text x="48" y="104">Portal</text>
        <text x="143" y="104" fill="#0039A6" font-weight="700">Inscrição</text>
        <text x="237" y="104">Revisão</text>
        <text x="332" y="104">Solicitação</text>
      </g>

      <!-- upload -->
      <rect x="24" y="122" width="332" height="78" rx="12" fill="#F3F7FF" stroke="#8DB0F3" stroke-width="1.5" stroke-dasharray="6 5"/>
      <rect x="42" y="136" width="36" height="50" rx="6" fill="#EF4B3C"/>
      <path d="M66 136h12v12z" fill="#fff" fill-opacity="0.35"/>
      <text x="60" y="167" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="800" fill="#fff">PDF</text>
      <text x="92" y="157" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0B1F4B">historico_escolar.pdf</text>
      <text x="92" y="176" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B7A99">Arquivo enviado com sucesso</text>
      <circle cx="326" cy="161" r="12" fill="#22C55E"/>
      <path d="M320 161.5l4.2 4.2 7.4-8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- disciplina + botão -->
      <rect x="24" y="214" width="214" height="36" rx="9" fill="#fff" stroke="#CBD6EC"/>
      <text x="40" y="237" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0B1F4B">Cálculo 1</text>
      <path d="M216 230l5 5 5-5" fill="none" stroke="#7A89A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="250" y="214" width="106" height="36" rx="9" fill="#0039A6"/>
      <text x="303" y="237" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">Continuar</text>
    </g>

    <!-- Cartão flutuante: IRA -->
    <g transform="translate(772,308)" filter="url(#shadowSm)">
      <rect width="176" height="88" rx="16" fill="#fff"/>
    </g>
    <g transform="translate(772,308)">
      <text x="20" y="30" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6B7A99">IRA extraído</text>
      <text x="20" y="70" font-family="Outfit, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#0039A6">4,82</text>
      <rect x="100" y="14" width="60" height="22" rx="11" fill="#E3F8EE"/>
      <text x="130" y="29" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#15803D">Conferido</text>
    </g>

    <!-- Chip flutuante: confirmação -->
    <g transform="translate(1040,314)" filter="url(#shadowSm)">
      <rect width="208" height="52" rx="26" fill="#0B1F4B"/>
    </g>
    <g transform="translate(1040,314)">
      <circle cx="28" cy="26" r="14" fill="#22C55E"/>
      <path d="M21.5 26.5l4.5 4.5 8-8.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="54" y="31" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">Inscrição registrada</text>
    </g>

    <!-- Filete inferior -->
    <rect x="0" y="436" width="1280" height="4" fill="url(#accent)"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
