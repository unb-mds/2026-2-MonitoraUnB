<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Documentação - MDS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css" title="docsify-darklight-theme" type="text/css" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');

  :root {
    --theme-color: #005A36; 
    --base-font-family: 'Poppins', sans-serif;
    --sidebar-name-font-weight: bold;
  }

  /* Efeito de destaque no menu lateral */
  .sidebar ul li.active > a {
    background: linear-gradient(90deg, #47a881 0%, #1ca870 100%);
    color: white !important;
    border-radius: 6px;
    padding: 5px 10px;
    transition: all 0.3s ease;
    font-weight: 500;
  }

  .sidebar ul li a:hover {
    color: #005A36;
    text-decoration: underline;
  }
</style>
</head>
<body>
  <div id="app">Carregando...</div>
  <script>
    window.$docsify = {
      name: 'Trabalho de MDS',
      repo: 'https://github.com/unb-mds/2026-2-MonitoraUnB.git',
      loadSidebar: true, 
      homepage: 'Como_executar.md',
      coverpage: true,
      subMaxLevel: 2
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <!-- Pesquisa -->
<script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
<!-- Botão de Copiar Código -->
<script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
<!-- Paginação no fim da página -->
<script src="//unpkg.com/docsify-pagination/dist/docsify-pagination.min.js"></script>
<!-- Tema Dark/Light -->
<script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js" type="text/javascript"></script>

<script src="https://unpkg.com/docsify-plugin-flexible-alerts"></script>
</body>
</html>
