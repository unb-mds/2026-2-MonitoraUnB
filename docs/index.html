<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Monitora-UnB | Documentação</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="assets/tema.css">
  <script>
    /* modo claro/escuro com botão e memória do navegador */
    (function(){var k='tema-mu',s='claro';try{s=localStorage.getItem(k)||(matchMedia('(prefers-color-scheme: dark)').matches?'escuro':'claro')}catch(e){}
    document.documentElement.setAttribute('data-tema',s);
    window.addEventListener('DOMContentLoaded',function(){var b=document.createElement('button');b.id='tema-btn';
    var l=function(){b.textContent=s==='escuro'?'Modo claro':'Modo escuro'};l();
    b.onclick=function(){s=s==='escuro'?'claro':'escuro';document.documentElement.setAttribute('data-tema',s);try{localStorage.setItem(k,s)}catch(e){}l()};
    document.body.appendChild(b)})})();
  </script>
</head>
<body>
  <div id="app">Carregando...</div>
  <script>
    window.$docsify = {
      name: 'Monitora-UnB',
      repo: 'unb-mds/2026-2-MonitoraUnB',
      homepage: 'inicio.md',
      coverpage: true,
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      search: { placeholder: 'Buscar na documentação', noData: 'Nada encontrado.', depth: 3 },
      pagination: { previousText: 'Anterior', nextText: 'Próximo' }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-plugin-flexible-alerts@1"></script>
</body>
</html>
