
services:

  # Banco de dados PostgreSQL
  db:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:-monitora_unb}
      POSTGRES_USER: ${DB_USER:-monitora}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - monitora_network

  # Backend: FastAPI, PDF e SMTP
  api:
    image: monitora-backend:dev

    build:
      context: .
      dockerfile: backend/Dockerfile

    restart: unless-stopped

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      DB_TYPE: postgresql
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-monitora_unb}
      DB_USER: ${DB_USER:-monitora}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}

      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}

      PROFESSOR_USERNAME: ${PROFESSOR_USERNAME:-professor}
      PROFESSOR_PASSWORD_HASH: ${PROFESSOR_PASSWORD_HASH:?Defina PROFESSOR_PASSWORD_HASH no .env}
      SESSION_SECRET: ${SESSION_SECRET:?Defina SESSION_SECRET no .env}


    depends_on:
      db:
        condition: service_healthy

    networks:
      - monitora_network

  # Frontend: HTML, CSS, TypeScript e Nginx
  frontend:
    build:
      context: .
      dockerfile: front-end/Dockerfile

    restart: unless-stopped

    ports:
      - "127.0.0.1:3000:80"

    depends_on:
      - api

    networks:
      - monitora_network

  # Scraping do SIGAA
  scraping:
    image: monitora-backend:dev

    profiles:
      - scraping

    command:
      - python
      - -m
      - backend.scraping.main

    environment:
      DB_TYPE: postgresql
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-monitora_unb}
      DB_USER: ${DB_USER:-monitora}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}

    depends_on:
      db:
        condition: service_healthy

    networks:
      - monitora_network

volumes:
  postgres_data:

networks:
  monitora_network:
    driver: bridge

