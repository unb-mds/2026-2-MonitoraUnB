<head>

    <title>Monitora-UnB</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="solicitacao-registrada.css">
</head>

<body>
    
    <header>

        <div class="logo">
            <strong>Monitora-UnB</strong>
        </div>

    </header>


    <main>

        <section class="confirmation">

            <div class="confirmation-message">

                <h1>Solicitação registrada!</h1>

                <p>
                    Sua inscrição foi registrada e após o envio ela será analisada

                </p>

                <p>
                    O resultado do processo será enviado para o
                    e-mail informado durante a inscrição.
                </p>

            </div>


        
            <div class="save-summary">
                <button onclick="alert('INSCRIÇÃO ENVIADA COM SUCESSO')"="button" id="download-summary">
                    Enviar inscrição
                </button>
            </div>

        </section>

    </main>
