<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitora-UnB — Ranking dos alunos</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="ranking.css">
    <link rel="icon"  type="image/x-icon" href="as_bas_cor.jpg">
</head>

<body>

    <header class="topbar">
        <a href="pagina_1_index.html" class="logo">Monitora<span>-UnB</span></a>
    </header>

    <section class="hero">
        <div class="hero-conteudo">
            <h1>Ranking dos alunos</h1>
            <p>Filtre por disciplina, veja quantos alunos se inscreveram e aprove ou reprove as candidaturas.</p>
        </div>
    </section>

    <main class="conteudo">
        <div class="coluna-larga">

            <!-- Filtros -->
            <section class="card filtros">
                <div class="campo">
                    <label for="filtro-disciplina">Disciplina</label>
                    <select id="filtro-disciplina"></select>
                </div>

                <div class="campo">
                    <label for="ordenar">Ordenar por</label>
                    <select id="ordenar">
                        <option value="ranking">Ranking (maior para menor)</option>
                        <option value="alfabetica">Ordem alfabética</option>
                    </select>
                </div>
            </section>

            <div class="barra-tabela">
                <p class="contador" id="contador"></p>
                <div class="botoes-barra">
                    <button type="button" class="btn btn-primario btn-baixar" id="btn-baixar">&#11015; Baixar planilha</button>
                </div>
            </div>

            <!-- Tabela -->
            <section class="card ranking-card">
                <div class="ranking-tabela">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Nome completo</th>
                                <th>Disciplina</th>
                                <th>Professor</th>
                                <th>IRA</th>
                                <th>COEF</th>
                                <th>Situação</th>
                                <th>Ação</th>
                            </tr>
                        </thead>
                        <tbody id="ranking-corpo"></tbody>
                    </table>
                </div>
            </section>

            <div class="acoes-ranking">
                <a href="pagina_1_index.html" class="btn btn-secundario">Sair</a>

                <!-- BOTÃO SEM FUNÇÃO POR ENQUANTO: o envio será feito pelo pessoal do TypeScript/back-end/banco.
                     Regra: enviar o e-mail apenas para os alunos com situação "Aprovado". -->
                <button type="button" class="btn btn-primario" id="btn-email">&#9993; Enviar e-mail aos aprovados</button>
            </div>

        </div>
    </main>

    <footer class="rodape">
        <p>&copy; 2026 Monitora-UnB. Todos os direitos reservados ao Grupo 11.</p>
    </footer>

    <script>
        /* ===== DADOS DE EXEMPLO =====
           Quando o banco estiver pronto, esta lista virá dele:
           uma linha por inscrição (status: pendente | aprovado | reprovado) */

        var inscricoes = [
            { id: 1, nome: "Beatriz Ferreira",  disciplina: "Cálculo 1",          professor: "Prof. Ana Souza",     ira: 4.62, coef: 0.91, status: "pendente" },
            { id: 2, nome: "Lucas Andrade",     disciplina: "Cálculo 1",          professor: "Prof. Ana Souza",     ira: 4.10, coef: 0.84, status: "pendente" },
            { id: 3, nome: "Camila Rocha",      disciplina: "Cálculo 1",          professor: "Prof. Carlos Lima",   ira: 4.35, coef: 0.88, status: "pendente" },
            { id: 4, nome: "Daniel Martins",    disciplina: "Cálculo 1",          professor: "Prof. Ana Souza",     ira: 3.85, coef: 0.80, status: "pendente" },
            { id: 5, nome: "Amanda Oliveira",   disciplina: "Estrutura de Dados", professor: "Prof. Marina Alves",  ira: 4.78, coef: 0.95, status: "pendente" },
            { id: 6, nome: "Gabriel Santos",    disciplina: "Estrutura de Dados", professor: "Prof. Ricardo Gomes", ira: 4.20, coef: 0.86, status: "pendente" },
            { id: 7, nome: "Isabela Costa",     disciplina: "Estrutura de Dados", professor: "Prof. Marina Alves",  ira: 4.05, coef: 0.82, status: "pendente" },
            { id: 8, nome: "Rafael Pereira",    disciplina: "Álgebra Linear",     professor: "Prof. Paulo Nunes",   ira: 3.95, coef: 0.79, status: "pendente" },
            { id: 9, nome: "Júlia Barbosa",     disciplina: "Álgebra Linear",     professor: "Prof. Paulo Nunes",   ira: 4.50, coef: 0.90, status: "pendente" }
        ];

        /* ===== ELEMENTOS ===== */
        var selDisciplina = document.getElementById("filtro-disciplina");
        var selOrdenar    = document.getElementById("ordenar");
        var corpo         = document.getElementById("ranking-corpo");
        var contador      = document.getElementById("contador");
        var btnBaixar     = document.getElementById("btn-baixar");
        var visiveis      = [];   // linhas que estão aparecendo agora (usadas na planilha)

        var ROTULOS = { pendente: "Pendente", aprovado: "Aprovado", reprovado: "Reprovado" };

        function fmt(n) { return n.toFixed(2).replace(".", ","); }

        function unicos(lista) {
            return lista.filter(function (v, i) { return lista.indexOf(v) === i; })
                        .sort(function (a, b) { return a.localeCompare(b, "pt-BR"); });
        }

        /* ===== FILTROS ===== */
        function preencherDisciplinas() {
            var nomes = unicos(inscricoes.map(function (i) { return i.disciplina; }));
            selDisciplina.innerHTML = '<option value="">Todas as disciplinas</option>' +
                nomes.map(function (n) { return '<option value="' + n + '">' + n + '</option>'; }).join("");
        }

        function filtradas() {
            return inscricoes.filter(function (i) {
                return (!selDisciplina.value || i.disciplina === selDisciplina.value);
            });
        }

        function porRanking(a, b) { return b.ira - a.ira || b.coef - a.coef; }

        /* ===== TABELA ===== */
        function desenhar() {
            var lista = filtradas();

            // posição no ranking (por IRA) dentro do filtro atual
            var posicao = {};
            lista.slice().sort(porRanking).forEach(function (i, idx) { posicao[i.id] = idx + 1; });

            var ordenada = lista.slice().sort(
                selOrdenar.value === "alfabetica"
                    ? function (a, b) { return a.nome.localeCompare(b.nome, "pt-BR"); }
                    : porRanking
            );

            contador.textContent = lista.length + (lista.length === 1 ? " candidato" : " candidatos");

            visiveis = ordenada.map(function (i) {
                return { pos: posicao[i.id], item: i };
            });
            btnBaixar.disabled = !ordenada.length;

            if (!ordenada.length) {
                corpo.innerHTML = '<tr><td colspan="8" class="vazio">Nenhuma inscrição encontrada.</td></tr>';
                return;
            }

            corpo.innerHTML = ordenada.map(function (i) {
                return '<tr class="' + (i.status === "pendente" ? "" : i.status) + '" data-id="' + i.id + '">' +
                    '<td>' + posicao[i.id] + '</td>' +
                    '<td>' + i.nome + '</td>' +
                    '<td>' + i.disciplina + '</td>' +
                    '<td>' + i.professor + '</td>' +
                    '<td>' + fmt(i.ira) + '</td>' +
                    '<td>' + fmt(i.coef) + '</td>' +
                    '<td><span class="situacao">' + ROTULOS[i.status] + '</span></td>' +
                    '<td><div class="botoes-acao">' +
                        '<button type="button" class="btn-acao btn-aprovar" data-acao="aprovado" aria-pressed="' + (i.status === "aprovado") + '">Aprovar</button>' +
                        '<button type="button" class="btn-acao btn-reprovar" data-acao="reprovado" aria-pressed="' + (i.status === "reprovado") + '">Reprovar</button>' +
                    '</div></td>' +
                '</tr>';
            }).join("");
        }

        /* ===== PLANILHA (CSV, abre no Excel e no Google Planilhas) ===== */
        function celula(valor) {
            var t = String(valor);
            if (/^[=+\-@]/.test(t)) t = "'" + t;            // evita fórmulas vindas de texto digitado
            return '"' + t.replace(/"/g, '""') + '"';
        }

        function gerarCSV() {
            var linhas = [["Posição", "Nome completo", "Disciplina", "Professor", "IRA", "COEF", "Situação"]];

            visiveis.forEach(function (v) {
                var i = v.item;
                linhas.push([v.pos, i.nome, i.disciplina, i.professor, fmt(i.ira), fmt(i.coef), ROTULOS[i.status]]);
            });

            // ponto e vírgula + BOM: o Excel em português abre com colunas e acentos corretos
            return "\uFEFF" + linhas.map(function (l) { return l.map(celula).join(";"); }).join("\r\n");
        }

        function baixarPlanilha() {
            if (!visiveis.length) return;

            var hoje = new Date().toISOString().slice(0, 10);
            var escopo = selDisciplina.value
                ? selDisciplina.value.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "")
                : "todas-as-disciplinas";

            var blob = new Blob([gerarCSV()], { type: "text/csv;charset=utf-8;" });
            var url  = URL.createObjectURL(blob);
            var a    = document.createElement("a");

            a.href = url;
            a.download = "ranking-monitoria-" + escopo + "-" + hoje + ".csv";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }


        /* ===== EVENTOS ===== */
        selDisciplina.addEventListener("change", desenhar);
        btnBaixar.addEventListener("click", baixarPlanilha);
        selOrdenar.addEventListener("change", desenhar);

        corpo.addEventListener("click", function (e) {
            var botao = e.target.closest(".btn-acao");
            if (!botao) return;

            var id = Number(botao.closest("tr").dataset.id);
            inscricoes.forEach(function (i) {
                if (i.id === id) i.status = botao.dataset.acao;
            });
            desenhar();
        });

        /* ===== INÍCIO ===== */
        preencherDisciplinas();
        desenhar();
    </script>

</body>

</html>
