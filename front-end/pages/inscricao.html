<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitora-UnB</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/inscricao.css">
</head>

<body>

    <header>
        <h1>Monitora-UnB</h1>
    </header>

    <main>

        <section>

            <h2>Faça sua inscrição</h2>

            <p>
                Escolha a disciplina para a qual deseja se candidatar
                e envie sua documentação.
            </p>


            <!-- Seleção da disciplina -->

            <!-- Upload da documentação -->

            <div class="form-group">

                <label for="historico">
                    Histórico:
                </label>

                <p class="description">
                    Envie seu histórico em formato PDF.
                </p>

                <input
                    type="file"
                    id="historico"
                    name="historico"
                    accept=".pdf"
                    required
                >

            </div>

            <div class="form-group">
                <label for="matricula">Digite o código da disciplina que deseja monitorar:</label>
                <input type="text" id="matricula" name="matricula" inputmode="numeric" placeholder="Ex.: MAT0025" required>
            </div>

            <a href="./revisao.html" class="continue-button">
                Continuar para revisão
            </a>

        </section>

    </main>

    <script type="module" src="../dist/pages/inscricao.js"></script>

</body>

</html>
