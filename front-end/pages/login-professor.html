<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonitoraUnB — Login do professor</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/login-professor.css">
    <link rel="icon" type="image/x-icon" href="as_bas_cor.jpg">
</head>

<body class="tema-professor">

    <header class="site-header tema-professor">
        <a href="inicio.html" class="brand">
            <span class="brand-logo">Un<span class="b-underline">B</span></span>
        </a>
        <a href="inicio.html" class="btn-trocar">← Trocar Portal</a>
    </header>

    <main class="conteudo login-conteudo">
        <div class="coluna login">

            <div class="login-intro">
                <div class="icone-caixa verde login-icone" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>
                <h1>Acesso do Professor</h1>
                <p>Insira suas credenciais institucionais para continuar</p>
            </div>

            <section class="card">
                <form id="form-login" novalidate>

                    <div class="campo">
                        <label for="login">Usuário</label>
                        <input type="text" id="login" name="login" autocomplete="username" placeholder="seu.usuario" required>
                    </div>

                    <div class="campo">
                        <label for="senha">Senha</label>
                        <div class="campo-senha">
                            <input type="password" id="senha" name="senha" autocomplete="current-password" required>
                            <button type="button" class="btn-olho" id="toggle-senha" aria-label="Mostrar senha" title="Mostrar senha">👁</button>
                        </div>
                    </div>

                    <p class="erro" id="erro-login" role="alert"></p>

                    <button type="submit" class="btn btn-verde btn-bloco">Entrar no Portal</button>

                </form>
            </section>

        </div>
    </main>

    <footer class="rodape">
        <div class="rodape-inner">
            <p>Sistema de Monitoria · Universidade de Brasília</p>
            <p>DEG — Decanato de Ensino de Graduação · 2026/2</p>
        </div>
    </footer>

    <script type="module" src="../dist/pages/login-professor.js"></script>
</body>

</html>
