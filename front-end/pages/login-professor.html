<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitora-UnB — Login do professor</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/login-professor.css">
    <link rel="icon" type="image/x-icon" href="as_bas_cor.jpg">
</head>

<body>

    <header class="topbar">
        <a href="inicio.html" class="logo">Monitora<span>-UnB</span></a>
    </header>

    <section class="hero">
        <div class="hero-conteudo">
            <h1>Área do professor</h1>
            <p>Entre para consultar o ranking dos candidatos às monitorias.</p>
        </div>
    </section>

    <main class="conteudo">
        <div class="coluna login">
            <section class="card">

                <form id="form-login" novalidate>

                    <div class="campo">
                        <label for="login">Login:</label>
                        <input type="text" id="login" name="login" autocomplete="username" required>
                    </div>

                    <div class="campo">
                        <label for="senha">Senha:</label>
                        <input type="password" id="senha" name="senha" autocomplete="current-password" required>
                    </div>

                    <p class="erro" id="erro-login" role="alert"></p>

                    <button type="submit" class="btn btn-primario btn-bloco">Entrar</button>

                </form>

                <a href="inicio.html" class="link-voltar">&larr; Voltar ao início</a>

            </section>
        </div>
    </main>

    <footer class="rodape">
        <p>&copy; 2026 Monitora-UnB. Todos os direitos reservados ao Grupo 11.</p>
    </footer>

    <script type="module" src="../dist/pages/login-professor.js"></script>
</body>

</html>
