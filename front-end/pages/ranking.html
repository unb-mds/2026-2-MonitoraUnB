<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitora-UnB — Ranking dos alunos</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/ranking.css">
    <link rel="icon"  type="image/x-icon" href="as_bas_cor.jpg">
    <link rel="stylesheet" href="../styles/processo-admin.css">
</head>

<body>

    <header class="topbar">
        <a href="inicio.html" class="logo">Monitora<span>-UnB</span></a>
    </header>

    <section class="hero">
        <div class="hero-conteudo">
            <h1>Ranking dos alunos</h1>
            <p>Filtre por disciplina, veja quantos alunos se inscreveram e aprove ou reprove as candidaturas.</p>
        </div>
    </section>

    <main class="conteudo">
        <div class="coluna-larga">

            <!-- Filtros -->
            <section class="card filtros">
                <div class="campo">
                    <label for="filtro-disciplina">Disciplina</label>
                    <select id="filtro-disciplina"></select>
                </div>

                <div class="campo">
                    <label for="ordenar">Ordenar por</label>
                    <select id="ordenar">
                        <option value="ranking">Ranking (maior para menor)</option>
                        <option value="alfabetica">Ordem alfabética</option>
                    </select>
                </div>
            </section>

            <div class="barra-tabela">
                <p class="contador" id="contador"></p>
                <div class="botoes-barra">
                    <div id="pa-bloco" class="pa-bloco">
    <button type="button" class="btn btn-primario" id="pa-iniciar">Iniciar processo seletivo</button>
    <span id="pa-status" class="pa-status"></span>
</div>
                    <p id="pa-aviso" class="pa-aviso" role="status" aria-live="polite" hidden></p>
                    <button type="button" class="btn btn-primario btn-baixar" id="btn-baixar">&#11015; Baixar planilha</button>
                </div>
            </div>

            <!-- Tabela -->
            <section class="card ranking-card">
                <div class="ranking-tabela">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Nome completo</th>
                                <th>Disciplina</th>
                                <th>Professor</th>
                                <th>IRA</th>
                                <th>COEF</th>
                                <th>Situação</th>
                                <th>Ação</th>
                            </tr>
                        </thead>
                        <tbody id="ranking-corpo"></tbody>
                    </table>
                </div>
            </section>

            <div class="acoes-ranking">
                <button type="button" class="btn btn-secundario" id="btn-sair">Sair</button>

                <!-- BOTÃO SEM FUNÇÃO POR ENQUANTO: o envio será feito pelo pessoal do TypeScript/back-end/banco.
                     Regra: enviar o e-mail apenas para os alunos com situação "Aprovado". -->
                <button type="button" class="btn btn-primario" id="btn-email">&#9993; Enviar e-mail aos aprovados</button>
            </div>

        </div>
    </main>
<dialog id="pa-dialogo" class="pa-dialogo" aria-labelledby="pa-titulo">
    <form id="pa-form" method="dialog">
        <h2 id="pa-titulo">Iniciar processo seletivo</h2>

        <div class="pa-campo">
            <label for="pa-semestre">Semestre</label>
            <input
                id="pa-semestre"
                name="semestre"
                type="text"
                placeholder="2026/2"
                pattern="[0-9]{4}/[12]"
                autocomplete="off"
                required
            >
        </div>

        <div class="pa-campo">
            <label for="pa-abertura">Início das inscrições</label>
            <input id="pa-abertura" name="data_abertura" type="date" required>
        </div>

        <div class="pa-campo">
            <label for="pa-encerramento">Fim das inscrições</label>
            <input id="pa-encerramento" name="data_encerramento" type="date" required>
        </div>

        <div class="pa-acoes">
            <button id="pa-cancelar" type="button" class="btn btn-secundario">Cancelar</button>
            <button id="pa-confirmar" type="submit" class="btn btn-primario">Confirmar e abrir</button>
        </div>
    </form>
</dialog>
    <footer class="rodape">
        <p>&copy; 2026 Monitora-UnB. Todos os direitos reservados ao Grupo 11.</p>
    </footer>

    <script type="module" src="../dist/pages/ranking-guard.js"></script>
    <script type="module" src="../dist/pages/ranking.js"></script>
    <script type="module" src="../dist/pages/iniciar-processo.js"></script>
</body>

</html>
