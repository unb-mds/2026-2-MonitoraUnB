server {
    listen 80;
    server_name localhost 127.0.0.1;

    root /usr/share/nginx/html;
    index index.html;

    # Impede o Nginx de gerar redirecionamentos absolutos
    absolute_redirect off;

    # Proxy reverso para backend FastAPI
    location /api/ {
        proxy_pass http://api:8000;

        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;


    }

    # Página inicial
    location = / {
        return 302 /pages/inicio.html;
    }

    # Arquivos estáticos e páginas
    location / {
        try_files $uri $uri/ @paginas;
    }

    # Permite acessar HTML diretamente pela raiz
    location @paginas {
        rewrite ^/(.*\.html)$ /pages/$1 last;
        return 404;
    }
}
